<!doctype html>
<html lang="en" data-mode="idle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="One dinosaur. One jump. An ordinary offline page unfolds into an impossible three-dimensional world.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
  <link rel="preload" as="image" href="assets/chrome-idle.png" imagesrcset="assets/chrome-idle.png 1x, assets/chrome-idle@2x.png 2x">
  <link rel="preload" as="image" href="assets/chrome-sprites.png?v=1" imagesrcset="assets/chrome-sprites.png?v=1 1x, assets/chrome-sprites@2x.png?v=1 2x">
  <meta property="og:site_name" content="Tap the Dino">
  <meta property="og:title" content="Tap the Dino">
  <meta property="og:description" content="Keep jumping. The world has other plans.">
  <meta property="og:type" content="website">
  <title>Tap the Dino</title>
  <link rel="canonical" href="https://tapthedino.com/">
  <meta property="og:url" content="https://tapthedino.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=51">
</head>
<body>
  <section id="chrome-opening" aria-label="Tap the Dino">
    <div class="chrome-body">
      <div class="chrome-wrapper">
        <div class="chrome-icon" aria-hidden="true"></div>
        <div class="chrome-message">
          <h1><span id="chrome-instruction">Press space to play</span></h1>
          <div class="chrome-suggestions">
            <p>Try:</p>
            <ul>
              <li>Checking the network cables, modem, and router</li>
              <li>Reconnecting to Wi-Fi</li>
            </ul>
          </div>
          <div class="chrome-code">ERR_INTERNET_DISCONNECTED</div>
        </div>
        <div class="chrome-footer" aria-hidden="true"></div>
        <div class="chrome-runner" id="runner" aria-hidden="true">
          <img class="chrome-dino" src="assets/chrome-idle.png" srcset="assets/chrome-idle.png 1x, assets/chrome-idle@2x.png 2x" width="44" height="150" alt="">
          <canvas id="runner-canvas" hidden></canvas>
        </div>
      </div>
    </div>
  </section>
  <canvas id="game" aria-label="Dinosaur transformation game. Space or tap to jump."></canvas>
  <div id="chapter" aria-live="polite"></div>
  <div id="health" role="img" aria-live="polite" aria-label="3 of 3 hearts"><span class="hearts" aria-hidden="true">♥♥♥</span><span class="health-cue" aria-hidden="true"></span></div>
  <div id="lap-status" hidden aria-label="Session score and lap speed"></div>
  <button id="pause" type="button" hidden aria-label="Pause (Escape)" title="Pause (Esc)">Ⅱ</button>
  <section id="pause-panel" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="pause-content">
      <h2 id="pause-title">Paused</h2>
      <p>Space / tap to jump · M for sound · Esc to resume</p>
      <nav id="bar" aria-label="Paused game controls">
        <button id="resume" type="button">Resume</button>
        <button id="mute" type="button">Sound (M)</button>
        <button id="bank" type="button" disabled>Finish &amp; keep score</button>
        <button id="again" type="button">Start again</button>
      </nav>
    </div>
  </section>
  <div id="end" role="dialog" aria-labelledby="end-title" hidden>
    <div class="end-info">
      <span id="end-title" class="end-title">Run over</span>
      <span class="end-scores">Score <strong id="end-score">0</strong> · Best <strong id="end-best">0</strong> <span id="end-new" class="end-new" hidden>★ New best</span></span>
    </div>
    <div class="end-actions">
      <button id="end-again" class="end-again" type="button">Play again ▶</button>
      <button id="end-share" type="button" title="Share https://tapthedino.com/">Share</button>
      <button id="end-close" class="end-close" type="button" aria-label="Dismiss" title="Dismiss (Esc)">×</button>
    </div>
  </div>
  <script src="art.js?v=51"></script>
  <script src="renderer.js?v=51"></script>
  <script src="audio.js?v=51"></script>
  <script src="opening.js?v=3"></script>
  <script src="game.js?v=51"></script>
</body>
</html>
